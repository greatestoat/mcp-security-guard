[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-security-guard"
version = "0.1.0"
description = "An approval-gated stdio proxy for Model Context Protocol servers"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.9,<2",
    "PySide6-Essentials>=6.7,<7",
]

[project.scripts]
mcp-security-guard = "mcp_security_guard.cli:main"
mcp-security-guard-desktop = "mcp_security_guard.gui:main"

[tool.setuptools.packages.find]
where = ["src"]
